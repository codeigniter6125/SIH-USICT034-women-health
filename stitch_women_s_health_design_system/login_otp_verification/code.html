<body class="bg-background text-on-surface min-h-screen flex flex-col items-center">
<!-- Mobile Container (Max Width 480px) -->
<div class="w-full max-w-max-width-mobile min-h-screen flex flex-col relative bg-background mx-auto shadow-sm md:shadow-none overflow-hidden">
<!-- TopAppBar -->
<header class="w-full top-0 bg-background flex items-center px-margin-mobile py-sm z-10 transition-opacity duration-200">
<button aria-label="Go back" class="text-primary hover:opacity-80 p-2 -ml-2 rounded-full focus:outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-50">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="flex-grow flex justify-center -ml-8">
<!-- Empty Headline as per JSON, keeping structure for alignment -->
<span class="font-display-lg text-display-lg text-primary opacity-0">Sangini</span>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col px-margin-mobile pt-lg pb-xl z-0">
<div class="flex flex-col space-y-md mt-lg mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">
                    Verify OTP<br/>
<span class="font-headline-md text-headline-md text-on-surface-variant mt-2 block">OTP सत्यापित करें</span>
</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                    We've sent a code to <span class="font-body-bold text-body-bold text-on-surface">+91 98765 43210</span>
</p>
</div>
<!-- OTP Input Form -->
<form class="flex flex-col space-y-xl flex-grow mt-md">
<!-- OTP Digits -->
<div class="flex justify-between space-x-sm px-2">
<input aria-label="Digit 1" class="otp-input w-16 h-16 text-center font-headline-lg-mobile text-headline-lg-mobile text-on-surface bg-surface-container-lowest border-[1.5px] border-outline rounded-2xl focus:border-primary focus:outline-none transition-all duration-200" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 2" class="otp-input w-16 h-16 text-center font-headline-lg-mobile text-headline-lg-mobile text-on-surface bg-surface-container-lowest border-[1.5px] border-outline rounded-2xl focus:border-primary focus:outline-none transition-all duration-200" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 3" class="otp-input w-16 h-16 text-center font-headline-lg-mobile text-headline-lg-mobile text-on-surface bg-surface-container-lowest border-[1.5px] border-outline rounded-2xl focus:border-primary focus:outline-none transition-all duration-200" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Digit 4" class="otp-input w-16 h-16 text-center font-headline-lg-mobile text-headline-lg-mobile text-on-surface bg-surface-container-lowest border-[1.5px] border-outline rounded-2xl focus:border-primary focus:outline-none transition-all duration-200" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
</div>
<div class="flex flex-col items-center space-y-lg mt-auto pb-lg pt-xl">
<button class="w-full bg-primary text-on-primary font-body-bold text-body-bold py-4 rounded-full min-h-[50px] hover:opacity-90 transition-opacity duration-200 focus:outline-none focus:ring-4 focus:ring-primary-container" type="button">
                        Verify and Continue
                    </button>
<button class="font-body-base text-body-base text-on-surface-variant hover:text-primary transition-colors duration-200 bg-transparent border-none p-2 mt-sm focus:outline-none focus:underline rounded" type="button">
                        Resend Code (00:30)
                    </button>
</div>
</form>
</main>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');

            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    const value = e.target.value;
                    if (value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });
            // Focus first input on load
            if(inputs.length > 0) inputs[0].focus();
        });
    </script>

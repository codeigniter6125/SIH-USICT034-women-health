<style>
        body {
            background-color: #FAF6F1; /* Fallback if surface class isn't exactly this */
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .mood-btn.selected {
            background-color: #F6EAE4;
            border-color: #8c4a2f;
            color: #8c4a2f;
        }
        .symptom-pill.selected {
            background-color: #caebd0;

            color: #042110;
        }

<body class="bg-surface text-on-surface font-body-base antialiased pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-on-surface-variant flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 max-w-dashboard mx-auto left-0 right-0">
<button aria-label="Menu" class="text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 transition-transform p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile md:text-headline-md text-primary dark:text-primary-fixed">Daily Check-in</h1>
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline flex-shrink-0">
<img alt="User profile" class="w-full h-full object-cover" data-alt="A close up, soft focus portrait of a young woman with a warm, natural expression. The lighting is bright, editorial, and flattering, emphasizing a healthy glow. Minimalist white background, high key lighting, conveying health, calm, and wellness." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBgQ9Yl2dNVpUxLUe_vnl4rSmirZi6eMseiZOJKYwoycoecgy7KkZBZsMJYhBeYB3bOUZz__HZLLsvMDxY7sPbvvDPaSYZ6AjedW9UceU7USEkzm7K-q7Vw8n5GkAl5VLy-DFjtIxfbE1BXJ3Uz5tgBuotcwkDoPWl8auzikQ-E0SWnMG43UmqsjFlr45Ynilaov-naM8zK7MvR-CU2gu-v4moyfZpDWqEXfA0twoS8xROa5umelEU"/>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 px-margin-mobile md:px-margin-desktop max-w-dashboard mx-auto space-y-xl pb-32">
<!-- Section 1: Mood -->
<section class="space-y-lg">
<h2 class="font-title-md text-title-md text-on-surface">How are you feeling today?</h2>
<div class="flex gap-4 overflow-x-auto hide-scrollbar pb-2 pt-1 -mx-margin-mobile px-margin-mobile md:mx-0 md:px-0 md:flex-wrap">
<!-- Mood Buttons -->
<button class="mood-btn flex flex-col items-center justify-center gap-2 min-w-[80px] h-[100px] bg-surface-container-lowest border-1.5 border-outline rounded-2xl transition-all duration-200 hover:border-primary shrink-0 selected" onclick="toggleMood(this)">
<span class="material-symbols-outlined text-[32px] text-tertiary">sentiment_satisfied</span>
<span class="font-body-base text-body-base text-on-surface-variant">Calm</span>
</button>
<button class="mood-btn flex flex-col items-center justify-center gap-2 min-w-[80px] h-[100px] bg-surface-container-lowest border border-outline rounded-2xl transition-all duration-200 hover:border-primary shrink-0" onclick="toggleMood(this)">
<span class="material-symbols-outlined text-[32px] text-tertiary">bolt</span>
<span class="font-body-base text-body-base text-on-surface-variant">Energetic</span>
</button>
<button class="mood-btn flex flex-col items-center justify-center gap-2 min-w-[80px] h-[100px] bg-surface-container-lowest border border-outline rounded-2xl transition-all duration-200 hover:border-primary shrink-0" onclick="toggleMood(this)">
<span class="material-symbols-outlined text-[32px] text-tertiary">bedtime</span>
<span class="font-body-base text-body-base text-on-surface-variant">Tired</span>
</button>
<button class="mood-btn flex flex-col items-center justify-center gap-2 min-w-[80px] h-[100px] bg-surface-container-lowest border border-outline rounded-2xl transition-all duration-200 hover:border-primary shrink-0" onclick="toggleMood(this)">
<span class="material-symbols-outlined text-[32px] text-tertiary">sentiment_dissatisfied</span>
<span class="font-body-base text-body-base text-on-surface-variant">Anxious</span>
</button>
<button class="mood-btn flex flex-col items-center justify-center gap-2 min-w-[80px] h-[100px] bg-surface-container-lowest border border-outline rounded-2xl transition-all duration-200 hover:border-primary shrink-0" onclick="toggleMood(this)">
<span class="material-symbols-outlined text-[32px] text-tertiary">sentiment_very_satisfied</span>
<span class="font-body-base text-body-base text-on-surface-variant">Joyful</span>
</button>
</div>
</section>
<!-- Section 2: Symptoms -->
<section class="space-y-lg">
<h2 class="font-title-md text-title-md text-on-surface">Any symptoms?</h2>
<div class="flex flex-wrap gap-3">
<button class="symptom-pill px-5 py-2.5 bg-surface-container-lowest border border-outline rounded-full font-body-base text-body-base text-on-surface-variant transition-all duration-200 hover:border-secondary" onclick="toggleSymptom(this)">Cramps</button>
<button class="symptom-pill px-5 py-2.5 bg-surface-container-lowest border border-outline rounded-full font-body-base text-body-base text-on-surface-variant transition-all duration-200 hover:border-secondary selected" onclick="toggleSymptom(this)">Bloating</button>
<button class="symptom-pill px-5 py-2.5 bg-surface-container-lowest border border-outline rounded-full font-body-base text-body-base text-on-surface-variant transition-all duration-200 hover:border-secondary" onclick="toggleSymptom(this)">Headache</button>
<button class="symptom-pill px-5 py-2.5 bg-surface-container-lowest border border-outline rounded-full font-body-base text-body-base text-on-surface-variant transition-all duration-200 hover:border-secondary" onclick="toggleSymptom(this)">Acne</button>
<button class="symptom-pill px-5 py-2.5 bg-surface-container-lowest border border-outline rounded-full font-body-base text-body-base text-on-surface-variant transition-all duration-200 hover:border-secondary" onclick="toggleSymptom(this)">Backache</button>
</div>
</section>
<!-- Section 3: Notes -->
<section class="space-y-sm">
<label class="block font-title-md text-title-md text-on-surface mb-2" for="notes">Notes for Maya</label>
<div class="relative">
<textarea class="w-full bg-surface-container-lowest border border-outline rounded-2xl p-4 font-body-base text-body-base text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/20 transition-all resize-none shadow-sm" id="notes" placeholder="Jot down anything else you're feeling..." rows="4"></textarea>
</div>
</section>
<div class="pt-4 flex justify-end">
<button class="bg-primary text-on-primary font-body-bold text-body-bold py-3 px-8 rounded-full hover:bg-surface-tint transition-colors w-full md:w-auto h-[50px] shadow-sm">
                Save Check-in
            </button>
</div>
</main>
<script>
        function toggleMood(btn) {
            // Deselect others if exclusive choice desired, or allow multiple. Assuming exclusive for mood.
            document.querySelectorAll('.mood-btn').forEach(b => {
                b.classList.remove('selected', 'border-primary', 'bg-primary-container');
                b.classList.add('border-outline', 'bg-surface-container-lowest');
                b.querySelector('span:first-child').classList.remove('text-primary');
                b.querySelector('span:first-child').classList.add('text-tertiary');
                b.querySelector('span:last-child').classList.remove('text-primary', 'font-body-bold');
                b.querySelector('span:last-child').classList.add('text-on-surface-variant', 'font-body-base');
            });
            
            btn.classList.add('selected');
            btn.classList.remove('border-outline', 'bg-surface-container-lowest');
            // Using inline classes for selected state to match tailwind
            btn.classList.add('border-primary', 'bg-primary-container');
            btn.querySelector('span:first-child').classList.remove('text-tertiary');
            btn.querySelector('span:first-child').classList.add('text-primary');
            btn.querySelector('span:last-child').classList.remove('text-on-surface-variant', 'font-body-base');
            btn.querySelector('span:last-child').classList.add('text-primary', 'font-body-bold');
        }

        function toggleSymptom(btn) {
            btn.classList.toggle('selected');
            if(btn.classList.contains('selected')) {
                btn.classList.remove('border-outline', 'bg-surface-container-lowest', 'text-on-surface-variant');
                btn.classList.add('border-secondary', 'bg-secondary-container', 'text-on-secondary-container', 'font-body-bold');
            } else {
                btn.classList.add('border-outline', 'bg-surface-container-lowest', 'text-on-surface-variant');
                btn.classList.remove('border-secondary', 'bg-secondary-container', 'text-on-secondary-container', 'font-body-bold');
            }
        }
        
        // Initialize selected states
        document.querySelectorAll('.mood-btn.selected').forEach(toggleMood);
        document.querySelectorAll('.symptom-pill.selected').forEach(btn => {
            btn.classList.remove('selected'); // hack to force toggle
            toggleSymptom(btn);
        });
    </script>
</body></html>

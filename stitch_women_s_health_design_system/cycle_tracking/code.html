<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Sangini Health - Cycle Tracking</title>

                        "surface-dim": "#ddd9d5",
                        "inverse-surface": "#31302d",
                        "on-primary-container": "#fffbff",
                        "on-surface": "#1c1c19",
                        "secondary-fixed-dim": "#aeceb5",
                        "primary-container": "#F6EAE4",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#f4f0eb",
                        "on-secondary-fixed-variant": "#304d39",
                        "surface-tint": "#8f4c31",
                        "on-tertiary-container": "#fffbff",
                        "inverse-primary": "#ffb599",
                        "escalation": "#C2452E",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#5e4034",
                        "on-background": "#1c1c19",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e6e2dd",
                        "outline-variant": "#d9c2ba",
                        "outline": "#D4C8BB",

                        "error": "#ba1a1a",

                        "primary-fixed": "#ffdbce",
                        "on-secondary-fixed": "#042110",
                        "secondary-container": "#caebd0",
                        "surface": "#fdf9f4",
                        "secondary": "#486550",
                        "primary": "#8c4a2f",
                        "escalation-container": "#FAEAE6",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#906c5f",
                        "secondary-fixed": "#caebd0",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#ffdbce",
                        "on-tertiary-fixed": "#2d150c",
                        "primary-fixed-dim": "#ffb599",
                        "on-primary": "#ffffff",
                        "custom-terracotta": "#C97B5C",
                        "custom-dustyrose": "#E3B8A8",
                        "custom-sage": "#5C7A64"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "2xl": "1rem"
                    },
                    "spacing": {
                        "sm": "8px",
                        "base-unit": "4px",
                        "max-width-mobile": "480px",
                        "lg": "24px",
                        "xs": "4px",
                        "md": "16px",
                        "margin-mobile": "16px",
                        "max-width-dashboard": "840px",
                        "gutter": "16px",
                        "margin-desktop": "32px",
                        "xl": "32px",
                        "safe": "env(safe-area-inset-bottom)"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Fraunces"],
                        "headline-md": ["Fraunces"],
                        "body-bold": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "body-base": ["Plus Jakarta Sans"],
                        "title-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Fraunces"],
                        "label-caps": ["Plus Jakarta Sans"],
                        "display-lg": ["Fraunces"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-bold": ["15px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-lg": ["17px", { "lineHeight": "26px", "fontWeight": "400" }],
                        "body-base": ["15px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "title-md": ["18px", { "lineHeight": "26px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.015em", "fontWeight": "600" }],

                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600" }]

                }
            }
        }

<style>
        .cycle-wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto;
        }
        
        .cycle-wheel-svg {
            transform: rotate(-90deg);
        }

        .cycle-segment {
            fill: none;
            stroke-width: 24;
            stroke-linecap: round;
        }
    </style>
</head>
<body class="bg-[#FAF6F1] text-on-surface min-h-screen flex flex-col font-body-base">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim z-40" style="border-bottom: 1px solid var(--tw-colors-outline-variant);">
<div class="flex justify-between items-center px-margin-mobile py-sm max-w-max-width-dashboard mx-auto">
<div class="flex items-center gap-3">
<img class="w-10 h-10 rounded-full object-cover border border-outline-variant" data-alt="A small, circular profile picture of a young South Asian woman smiling softly in natural daylight. She is wearing a simple, elegant top. The background is slightly blurred and features warm, earthy tones consistent with a calm, premium health companion aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBsH7rCBmsOqMrNZJn7TJNdwApwvqKQathXENRyOsnRyDtqtdTdyGVRI2hfgoDs9sCDPhzv51K_C6D4vWEp-BDCxi5lMe0SmQAFrQHO_lxUVw3Bgc83fBS1viIwfA-47oea5VLAn8IxLsSYqYgOFwwd8lZ5aS5AXwRMn990RuJWuUhDFeE-x_Y-S4g5D3hbmC6bomuzcY8XoXYgjeP_sTOpkGEpEw00vMuUppr46eRaIbgWDhulenM">
</div>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim">She Care</h1>
<button class="text-primary dark:text-primary-fixed-dim cursor-pointer active:opacity-80 hover:bg-surface-container-high transition-colors p-2 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 max-w-max-width-dashboard mx-auto w-full px-margin-mobile pt-lg pb-32">
<!-- Cycle Wheel Section -->
<section class="mb-xl flex flex-col items-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-8 text-center">Your Cycle</h2>
<div class="cycle-wheel-container">
<!-- SVG Wheel -->
<svg class="cycle-wheel-svg w-full h-full" viewBox="0 0 200 200">
<!-- Base Track (Light Sage/Cream) -->
<circle cx="100" cy="100" fill="none" r="80" stroke="#f1ede8" stroke-width="20"></circle>
<!-- Period Phase (Terracotta) -->
<!-- Approx 5 days out of 28 -> roughly 64 degrees -->
<circle class="cycle-segment" cx="100" cy="100" r="80" stroke="#C97B5C" stroke-dasharray="80 422" stroke-dashoffset="0"></circle>
<!-- Fertile Window (Dusty Rose) -->
<!-- Roughly days 10-15 -> offset by period + buffer -->
<circle class="cycle-segment" cx="100" cy="100" r="80" stroke="#E3B8A8" stroke-dasharray="100 402" stroke-dashoffset="-150"></circle>
<!-- Current Day Indicator (Small dot) -->
<circle cx="178" cy="116" fill="#1c1c19" r="6" stroke="#ffffff" stroke-width="2"></circle>
</svg>
<!-- Central Summary -->
<div class="absolute inset-0 flex flex-col items-center justify-center text-center">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface block mb-1">Day 12</span>
<span class="font-body-base text-body-base text-on-surface-variant max-w-[120px]">Next period in 16 days</span>
</div>
</div>
</section>
<!-- Quick Actions -->
<section class="mb-xl grid grid-cols-2 gap-4">
<button class="bg-surface-container-lowest border border-outline rounded-2xl p-4 flex flex-col items-center justify-center gap-2 hover:bg-surface-container-low transition-colors active:opacity-80">
<span class="material-symbols-outlined text-custom-terracotta text-3xl" style="font-variation-settings: 'FILL' 1;">water_drop</span>
<span class="font-body-bold text-body-bold text-on-surface">Log Symptoms</span>
</button>
<button class="bg-surface-container-lowest border border-outline rounded-2xl p-4 flex flex-col items-center justify-center gap-2 hover:bg-surface-container-low transition-colors active:opacity-80">
<span class="material-symbols-outlined text-custom-sage text-3xl" style="font-variation-settings: 'FILL' 0;">edit_note</span>
<span class="font-body-bold text-body-bold text-on-surface">Add Note</span>
</button>
</section>
<!-- Insights Section -->
<section class="mb-xl">
<h3 class="font-title-md text-title-md text-on-surface mb-4">Insights</h3>
<div class="bg-surface-container-lowest border border-outline rounded-2xl p-5 flex items-start gap-4">
<div class="bg-[#caebd0] rounded-full p-2 flex-shrink-0">
<span class="material-symbols-outlined text-custom-sage" style="font-variation-settings: 'FILL' 1;">mood</span>
</div>
<div>
<p class="font-body-bold text-body-bold text-on-surface mb-1">Your mood has been steady this week</p>
<p class="font-body-base text-body-base text-on-surface-variant">Based on your logs, you are experiencing a calm phase. Keep hydrating.</p>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-3 pb-safe bg-surface dark:bg-surface-dim z-50 shadow-[0_-2px_8px_rgba(43,38,32,0.04)] md:hidden" style="border-top: 1px solid var(--tw-colors-outline-variant);">
<!-- Home (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-3 py-1 hover:bg-surface-container-low transition-all active:scale-95 duration-200 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</a>
<!-- Cycle (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-on-primary-fixed-variant text-on-primary-container dark:text-primary-fixed rounded-xl px-3 py-1 hover:bg-surface-container-low transition-all active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined mb-1 text-primary" style="font-variation-settings: 'FILL' 1;">cycle</span>
<span class="font-label-caps text-label-caps text-primary">Cycle</span>
</a>
<!-- Reports (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-3 py-1 hover:bg-surface-container-low transition-all active:scale-95 duration-200 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">description</span>
<span class="font-label-caps text-label-caps">Reports</span>
</a>
<!-- Chat (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-3 py-1 hover:bg-surface-container-low transition-all active:scale-95 duration-200 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">chat_bubble</span>
<span class="font-label-caps text-label-caps">Chat</span>
</a>
</nav>


</body></html>
